<!-- Input nativo oculto que abre a câmera traseira do celular com alta resolução -->
 <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f5f5f5;">

  <input 
  #fileInput 
  type="file" 
  accept="image/*" 
  capture="environment" 
  style="display: none;" 
  (change)="onFileSelected($event)">

<!-- Botão estilizado do PrimeNG para disparar a câmera -->
<!-- Botão estilizado do PrimeNG corrigido com evento do Angular -->
<!-- <p-button
  label="Escanear Etiqueta"
  icon="pi pi-camera"
  styleClass="p-button-raised p-button-primary"
  (click)="abrirCamera()">
</p-button> -->

<ion-button expand="block" color="primary" (click)="abrirCamera()" class="mt-4">
  <ion-icon slot="start" name="camera"></ion-icon>
  Escanear Etiqueta
</ion-button>


  <div *ngIf="resposta" class="card-resultado p-4 bg-white shadow rounded mt-4">
    <h3 class="text-lg font-bold text-gray-700 mb-3">📦 Detalhes do Pedido: </h3>
  
    <ul class="space-y-2 text-sm text-gray-600">
      <li><strong>ID do Pedido:</strong> <span class="text-blue-600 font-semibold"> {{ resposta2 }}</span></li>
      <li><strong>Cliente:</strong> {{ resposta.destinatario }}</li>
      <li><strong>Rua:</strong> {{ resposta.rua }}</li>   
      <li><strong>Bairro:</strong> {{ resposta.bairro }}</li>      
      <li><strong>CEP:</strong> {{ resposta.cep }}</li>
      <li><strong>Cidade/UF:</strong> {{ resposta.cidade_uf }}</li>
    </ul>
   </div>  


   <ion-app>
  <!-- O Split Pane divide a tela em tablets/desktops e oculta automaticamente em telemóveis -->
  <ion-split-pane content-id="main-content">
    
    <!-- O Menu Lateral (Sidebar) -->
    <ion-menu content-id="main-content" menu-id="main-menu">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Menu Marju</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/home" routerDirection="root">
              <ion-icon name="home-outline" slot="start"></ion-icon>
              <ion-label>Início</ion-label>
            </ion-item>
            
            <ion-item routerLink="/camera" routerDirection="root">
              <ion-icon name="camera-outline" slot="start"></ion-icon>
              <ion-label>Escanear Etiqueta</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- Conteúdo Principal da Aplicação -->
    <ion-router-outlet id="main-content"></ion-router-outlet>

  </ion-split-pane>
</ion-app>
  
</div>
