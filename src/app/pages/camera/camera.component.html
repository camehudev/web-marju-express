<!-- Input nativo oculto que abre a câmera traseira do celular com alta resolução -->
 <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f5f5f5;">

  <input 
  #fileInput 
  type="file" 
  accept="image/*" 
  capture="environment" 
  style="display: none;" 
  (change)="onFileSelected($event)">

<!-- Botão estilizado do PrimeNG para disparar a câmera -->
<p-button 
  label="Escanear Etiqueta" 
  icon="pi pi-camera" 
  styleClass="p-button-raised p-button-primary" 
  (onClick)="fileInput.click()">
</p-button>

<div class="flex justify-content mt-3" *ngIf="resposta">
  <span class="flex mt-6">RESPOSTA</span>
  <p>{{ resposta | json }}</p>
</div>

 </div>
